<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Header B (JA)</title>
<link rel="stylesheet" href="style.css">
<style>
  .copy { position: absolute; left: 480px; top: 50%; transform: translateY(-50%); width: 1500px; }
  .brand { --s: 116px; margin-bottom: 80px; }
  /* JA: three lines broken by hand (longest is 7 full-width characters); Latin tracking and line height reset. Not rendered yet. */

  .sub { font-size: 54px; margin-top: 60px; max-width: 1150px; letter-spacing: 0; }
</style>
</head>
<body class="header">
  <div class="copy">
    <div class="brand"><img src="src/icon.png" alt=""><span>Wingman</span></div>
    <h1 class="headline">自分から<br><em>声をかけに行く</em><br>男になる。</h1>
    <p class="sub">どこにいても、会話を始められる自信を。</p>
  </div>

  <img class="art" src="src/art-approach.png" alt="" style="left:1640px; top:200px; width:1240px">
  <div class="phone" data-src="src/app-courses.png" style="--w:560px; left:2790px; top:250px; transform:rotate(4deg)"></div>

  <div class="guide" style="left:10%; top:12%; width:80%; height:76%"></div>
  <script src="phone.js"></script>
</body>
</html>
